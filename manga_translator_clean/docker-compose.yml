version: '3.8'

services:
  manga-translator:
    build: .
    container_name: manga_translator
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./web/static/uploads:/app/web/static/uploads
    environment:
      - PORT=5000
    restart: unless-stopped
